<!doctype html>
<!-- E2: FORMULARIO DE REGISTRO -->
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulario de Registro</title>
  </head>
  <body>
    <h1>Formulario de Registro</h1>

    <!-- FORMULARIO -->
    <form action="#" method="post">
      <!-- INFORMACION PERSONAL -->
      <fieldset>
        <legend>Información Personal</legend>

        <!-- NOMBRE -->
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" required />

        <!-- APELLIDO -->
        <label for="apellido">Apellido:</label>
        <input type="text" id="apellido" name="apellido" required />

        <!-- FECHA DE NACIMIENTO -->
        <label for="nacimiento">Fecha de Nacimiento:</label>
        <input type="date" id="nacimiento" name="nacimiento" required />

        <!-- GENERO (BOTONES DE RADIO) -->
        <p>Género:</p>
        <input type="radio" id="masculino" name="genero" value="masculino" required/>
        <label for="masculino">Masculino</label>

        <input type="radio" id="femenino" name="genero" value="femenino" required/>
        <label for="femenino">Femenino</label>

        <input type="radio" id="otro" name="genero" value="otro" required />
        <label for="otro">Otro</label>
      </fieldset>

      <!-- INFORMACION DE CONTACTO -->
      <fieldset>
        <legend>Información de Contacto</legend>

        <!-- CORREO ELECTRONICO -->
        <label for="correo">Dirección de correo electrónico:</label>
        <input type="email" id="correo" name="correo" required />

        <!-- TELEFONO -->
        <label for="telefono">Número de teléfono:</label>
        <input type="tel" id="telefono" name="telefono" required />

        <!-- DIRECCION -->
        <label for="direccion">Dirección:</label><br />
        <textarea id="direccion" name="direccion" rows="3" cols="30"></textarea>
      </fieldset>

      <!-- INFORMACION DE CUENTA -->
      <fieldset>
        <legend>Información de Cuenta</legend>

        <!-- NOMBRE DE USUARIO -->
        <label for="usuario">Nombre de Usuario:</label>
        <input type="text" id="usuario" name="usuario" required />

        <!-- CONTRASEÑA -->
        <label for="clave">Contraseña:</label>
        <input type="password" id="clave" name="clave" required />

        <!-- CONFIRMACION DE CONTRASEÑA -->
        <label for="clave2">Confirmación de contraseña:</label>
        <input type="password" id="clave2" name="clave2" required />
      </fieldset>

      <!-- PREFERENCIAS -->
      <fieldset>
        <legend>Preferencias</legend>

        <!-- COLOR FAVORITO (SELECT) -->
        <label for="color">Color favorito:</label>
        <select id="color" name="color">
          <option value="rojo">Rojo</option>
          <option value="azul">Azul</option>
          <option value="verde">Verde</option>
          <option value="amarillo">Amarillo</option>
        </select>

        <!-- TERMINOS Y CONDICIONES (CHECKBOX) -->
        <input type="checkbox" id="terminos" name="terminos" required />
        <label for="terminos">Acepto los términos y condiciones</label>
      </fieldset>

      <!-- BOTON DE ENVIO -->
      <button type="submit">Registrarse</button>
    </form>
  </body>
</html>
